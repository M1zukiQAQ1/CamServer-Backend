server:
  port: 443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: server@2025
    key-store-type: PKCS12
    key-alias: tomcat
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:   # Configuration for SQL Server
    url: jdbc:sqlserver://localhost:1433;databaseName=CamServer;encrypt=true;trustServerCertificate=true
    username: sa
    password: Server@2025
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      # The production schema is managed in SQL Server; "update" previously added stray
      # cameraId/siteName columns and fails every start trying to alter CamId/Users.
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
app:
  cors:
    # Browser origins allowed to call the API. The Nuxt proxy forwards the browser's Origin header,
    # so every host name the site is served under must be listed (patterns like http://host:[*] work).
    # Override with APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: http://localhost:[*],http://127.0.0.1:[*],https://armageddon.deepspace.ucsb.edu,http://armageddon.deepspace.ucsb.edu,https://camserver.physics.ucsb.edu,http://camserver.physics.ucsb.edu
  http:
    # Plain HTTP for the co-located Nuxt frontend proxy only; never exposed beyond loopback.
    loopback-port: 8080
    loopback-address: 127.0.0.1
  site:
    # Where the Nuxt site is served; legacy backend pages redirect there.
    public-url: ${APP_SITE_PUBLIC_URL:http://armageddon.deepspace.ucsb.edu}
  live:
    # Persist website capture controls across backend restarts.
    settings-file: ${CAMSERVER_SEEING_SETTINGS_FILE:./data/seeing-monitor-settings.json}
    default-exposure-us: ${CAMSERVER_SEEING_EXPOSURE_US:100000}
    default-gain: ${CAMSERVER_SEEING_GAIN:60}
    # Seeing-monitor video relay (see LiveStreamController). The camera host pushes fragmented
    # MP4 to POST /api/live/ingest; browsers read GET /api/live/stream.mp4 through the Nuxt proxy.
    # When the token is empty anyone who can reach this port may publish the stream.
    ingest-token: ${CAMSERVER_LIVE_INGEST_TOKEN:}
    max-box-bytes: 33554432      # largest single MP4 box (one fragment) accepted from the producer
    viewer-queue-limit: 600      # fragments a slow viewer may fall behind before it is dropped
  health:
    # Health panel (GET /api/health): upload freshness per camera, host probes, seeing stream, server.
    # Checked in the background; requests only read the newest result.
    refresh-seconds: 60
    probe-timeout-ms: 2500
    warn-after-minutes: 20      # newest frame older than this -> WARN (the Pi uploads every ~5 min)
    down-after-minutes: 60      # ... older than this -> DOWN
    inactive-after-days: 30     # no host configured and no frame for this long -> INACTIVE (retired)
    cameras:
      - camera-id: QHY5III678M-54ffe941916d2aa46
        host: allskycam2.deepspace.ucsb.edu
        ports: [22]
        note: Raspberry Pi on the Broida Hall roof (mono camera); one frame every ~5 minutes.
      - camera-id: QHY5III678C-57bbd14782e9f938e
        host: 162.252.89.93
        ports: [22, 80, 443]
        note: White Mountain Research Center, Owens Valley Lab. Its uploader still posts to camserver.physics.ucsb.edu:443, which no longer accepts uploads.
      - camera-id: QHY5III678C-5488ae4295e916553
        note: Colour camera that used to sit on the Broida Pi; replaced by the mono unit.
    seeing:
      label: Seeing Monitor
      host: seeingcam.deepspace.ucsb.edu
      ports: [22]
      stale-after-seconds: 10
      telemetry-stale-after-seconds: 30
      note: Polaris camera on seeingcam; streams H.264 at 5 fps to /api/live/ingest.
  images:
    base-dir: /mnt/CamData/images
    archive:
      # On-demand compression of FITS frames (see /api/archive). Write endpoints stay disabled
      # until CAMSERVER_ARCHIVE_TOKEN is set in the service environment.
      admin-token: ${CAMSERVER_ARCHIVE_TOKEN:}
      # Storage format for archived frames.
      #   rice: FITS tile compression (Rice) through CFITSIO's fpack, verified by decoding the
      #         result with imcopy. The .fz file is still a valid FITS file. 16-bit frames are
      #         first shifted right by rice.shift-bits when every pixel allows it (the cameras
      #         deliver 14-bit samples in 16-bit words), which is lossless and saves another
      #         2 bits per pixel; readers reconstruct the values through BSCALE. Existing .gz
      #         files are converted to .fz by the next compress job.
      #   gzip: whole-file gzip (the previous behaviour).
      format: rice
      rice:
        fpack-command: fpack        # both tools come with libcfitsio-bin
        imcopy-command: imcopy
        shift-bits: 2               # 0 disables the shift
        tool-timeout-seconds: 300
      gzip-level: 6
      worker-threads: 4
      min-age-minutes: 10
      extensions: .fits,.fit,.fts
      temp-dir: /tmp/camserver-archive
      # Temp files an interrupted run left behind (name.tmp-N next to the frames and in temp-dir)
      # are removed at startup and before each job once they have been idle this long.
      stale-temp-minutes: 60
      # Automatic compression of old frames: one run shortly after startup (works through any
      # backlog), then daily. Status at GET /api/archive/auto, trigger with POST /api/archive/auto/run.
      auto:
        enabled: true
        older-than-days: 30
        cron: "0 30 4 * * *"     # server local time
        startup-delay: PT3M
        max-files-per-run: 0     # 0 = no limit
  plate-solve:
    enabled: true
    fits-imcopy-command: imcopy
    work-dir: /tmp/camserver-plate-solve
    fits-extraction-timeout-seconds: 30
    worker-threads: 2
    lost:
      enabled: true
      command: ${LOST_COMMAND:lost}
      database: ${LOST_DATABASE:data/lost/bright-stars.dat}
      timeout-seconds: 15
      angular-tolerance-deg: 0.05
      max-stars: 40
    max-stars: 800
    max-star-area: 80
    max-star-diameter: 18
    max-star-background: 95
    crop-threshold: 12
    fits-crop-threshold: 32
    star-min-contrast: 18
    fits-star-min-contrast: 42
    star-contrast-percentile: 0.9985
    fits-star-contrast-percentile: 0.9994
    site-latitude-deg: 34.41403
    site-longitude-deg: -119.84300
    catalog-path: classpath:catalogs/bright-stars.csv
    catalog-match-radius-deg: 0.05
    online-catalog:
      enabled: true
      url: https://simbad.cds.unistra.fr/simbad/sim-tap/sync
      cache-file: /tmp/camserver-plate-solve/catalog-cache/simbad-bright-stars.csv
      cache-ttl-hours: 720
      magnitude-limit: 8.0
      max-rows: 30000
      timeout-ms: 10000
    mask:
      auto-fisheye-enabled: true
      auto-fisheye-usable-radius: 0.74
      auto-fisheye-threshold: 12
      auto-glare-enabled: true
      auto-glare-threshold: 210
      auto-glare-min-area: 80
      auto-glare-dilation-px: 64
      auto-glare-band-enabled: true
      auto-glare-band-threshold: 60
      auto-glare-band-min-area: 500
      auto-glare-band-dilation-px: 72
      auto-glare-band-rim-radius: 0.35
      static-enabled: true
      static-dir: /mnt/CamData/plate-solve-masks
      yolo-enabled: false
      yolo-url: http://127.0.0.1:8765/segment
      yolo-timeout-ms: 2500
      yolo-min-confidence: 0.35
      labels: cloud,tree,building,horizon,obstruction,antenna,glare
